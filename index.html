<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumaysa Fatima</title>
    <link href='https://fonts.googleapis.com/css?family=Labrada' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Lato' rel='stylesheet'>
  
    <style>
      html {
        scroll-behavior: smooth;
      }
      @import url('https://fonts.googleapis.com/css?family=Poppins:400,500,700&display=swap');
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        body {
        font-family: lato;
        color: #f5f5f5;
        background: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1;
        }   

        html, body {
          overflow-x: hidden;
        }

        /* Scroll progress indicator */
        .scroll-progress {
          position: fixed;
          top: 0;
          left: 0;
          width: 0%;
          height: 3px;
          background: linear-gradient(90deg, #A78989, #633B48);
          z-index: 1000;
          transition: width 0.1s ease;
        }


        /* Background circles inside scrollable flow */
        .background-circles {
          position: absolute; /* scrolls with page */
          top: 0;
          left: 0;
          width: 100%;
          pointer-events: none;
          z-index: -1;
        }

        .circle {
          position: absolute;
          border-radius: 80%;
          filter: blur(80px);
          opacity: 0.4;
          animation: move 5s ease-in-out infinite alternate; /* faster motion */
        }

        /* Custom circle positions */
        .circle1 {
          width: 400px;
          height: 400px;
          background-color: #fff;
          top: -150px;     /* top right */
          right: -120px;
            --color1: #ffffff;
            --color2: #5E4545;
          animation-delay: 2s;
          overflow: hidden;
        }

        .circle2 {
          width: 600px;
          height: 600px;
          background-color: #5E4545;
          top: 250px;    /* middle left */
          left: -100px;
          --color1: #5E4545;
          --color2: #633b48;
          animation-delay: 1s;
        }

        .circle3 {
          width: 400px;
          height: 400px;
          background-color:#373737;
          top: 900px;    /* near footer */
          right: 10px;
          --color1: #373737;
          --color2: #B09B9B;
          animation-delay: 0s;
        }

        /* Smooth movement */
        @keyframes move {
          0% {
            transform: translate(0, 0) scale(1);
            background-color: var(--color1);
          }
          50% {
            transform: translate(20px, 20px) scale(1.05);
          }
          100% {
            transform: translate(120px, -80px) scale(1.1);
            background-color: var(--color2);
          }
        }
        



        /* Navbar styling */
        .navbar {
        margin-top: 20px;
        position: fixed;
        top: 0;
        z-index: 999; 
        }

        .nav-links {
        list-style: none;
        display: flex;
        gap: 10px;
        padding: 10px 20px;
        background: rgba(176, 176, 176, 0.39);
        border-radius: 100px;
        backdrop-filter: blur(40px);
        }

        .nav-links a {
        text-decoration: none;
        color: #f5f5f5;
        padding: 6px 14px;
        border-radius: 90px;
        font-size: 14px;
        transition:  0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
        background: rgba(196, 156, 169, 0.6);
        }

        #home {
          min-height: 100vh;
        }


        /* Intro text section */
        .intro {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 250px 20px 80px;
        }

        .intro-text {
        border-left: 2px solid #f5f5f5;
        padding-left: 20px;
        max-width: 500px;
        height: 130px;
        }

        .intro-text h1 {
        font-size: 30px;
        margin-bottom: 10px;
        font-family: labrada;
        font-weight: 300;
        }

        .intro-text p {
        font-size: 16px;
        margin-bottom: 4px;
        color: #cccccc;
        font-family: lato;
        }

        /* Projects section */
        .projects {
        gap: 40px;
        z-index: 1; /* ensure projects are above background circles */
        margin-bottom: 300px;

        }

          .project-card {
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          background-color: rgba(128, 128, 128, 0.2);
          backdrop-filter: blur(40px);
          padding: 0;
          width: 280px;
        
          overflow: hidden;
          transition: transform 0.3s ease;
          box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .projects h2 {
          margin-bottom: 2rem;
          font-size: 1.5rem;
          align-items: center;
        }

        .project-grid {
          display: flex;
          justify-content: center;
          gap: 3rem;
          flex-wrap: wrap;
        }

        .project-card:hover {
          transform: translateY(-5px);
        }

        .project-card img {
          width: 100%;
          height: auto;
          display: block;
        }

        .project-info {
          padding: 1rem;
          text-align: left;
          line-height: 20px;
        }

        .project-info small {
          color: #B09B9B;
        }

          .card-icon-open {
          display: block;
          text-align: right;
          margin-top: 20px;
          font-size: 18px;
          color: #fff;
          width: 20px;
          margin-left: auto;
        }

        .card-icon-none {
          display: block;
          text-align: right;
          margin-top: 20px;
          font-size: 18px;
          color: #fff;
          opacity: 0.4;
          width: 20px;
          margin-left: auto;
        }

        /* Footer */
        .contact {
        text-align: center;
        padding: 60px 20px;
        color: #f5f5f5;
         font-size: 16px;
         z-index: 1;
        }

        .contact-links {
        margin-top: 12px;
        margin-bottom: 28px;
        }

        .contact-links a {
        margin: 0 10px;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s ease;
        color:#B09B9B;
        }

        .contact-links a:hover {
        color: #f5f5f5;
        }

        /* Scroll animation */

        .wrapper {
        width: 100%;
        height: 18vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .wrapper .box span {
        width: 15px;
        height: 15px;
        display: block;
        border-right: 4px solid #B09B9B;
        border-bottom: 4px solid #B09B9B;
        transform: rotate(45deg);
        animation: animate 3s infinite;
      }

      .wrapper .box span:nth-child(2) {
        animation-delay: -0.2s;
      }

      .wrapper .box span:nth-child(3) {
        animation-delay: -0.4s;
      }

      @keyframes animate {
        0% {
          opacity: 0;
        }
        50% {
          opacity: 1;
          transform: rotate(45deg) translate(10px, 10px);
        }
        100% {
          opacity: 0;
        }
      }
    </style>
</head>

<script>
  const sections = document.querySelectorAll("section[id]");
  const navLinks = document.querySelectorAll(".nav-links a");

  window.addEventListener("scroll", () => {
    let current = "home"; // default to Home

    sections.forEach((section) => {
      const sectionTop = section.offsetTop - 120;
      const sectionHeight = section.offsetHeight;

      if (scrollY >= sectionTop && scrollY < sectionTop + sectionHeight) {
        current = section.getAttribute("id");
      }
    });

    navLinks.forEach((link) => {
      link.classList.remove("active");
      if (link.getAttribute("href") === `#${current}`) {
        link.classList.add("active");
      }
    });
  });
</script>
<script>
      const scrollProgress = document.getElementById('scrollProgress');
      
      window.addEventListener('scroll', () => {
        const windowHeight = window.innerHeight;
        const documentHeight = document.documentElement.scrollHeight - windowHeight;
        const scrolled = window.scrollY;
        const progress = (scrolled / documentHeight) * 100;
        
        scrollProgress.style.width = progress + '%';
      });
</script>
